<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt hàng thành công | CHERI.</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <script src="../assets/js/app.js" defer></script>
    <script src="../assets/js/auth.js" defer></script>

    <style>
        .success-page {
            max-width: 760px;
            margin: 50px auto;
            padding: 24px;
        }

        .success-card {
            padding: 32px;
            background: #fff;
            border: 1px solid #f0dce5;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(100, 50, 70, .06);
        }

        .success-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #fce8f0;
            color: #b74775;
            font-size: 32px;
        }

        .success-heading {
            text-align: center;
            color: #b74775;
        }

        .success-description {
            text-align: center;
            color: #666;
        }

        .order-code {
            margin: 24px 0;
            padding: 18px;
            text-align: center;
            background: #fff5f9;
            border: 1px dashed #d98bad;
            border-radius: 10px;
        }

        .order-code strong {
            display: block;
            margin-top: 8px;
            font-size: 22px;
            color: #a83264;
            overflow-wrap: anywhere;
        }

        .order-info {
            margin-top: 24px;
            line-height: 1.9;
        }

        .order-info h2 {
            font-size: 18px;
            margin-bottom: 12px;
        }

        .order-total {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid #eee;
            font-size: 18px;
            font-weight: 700;
        }

        .success-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 28px;
        }

        .success-actions a,
        .success-actions button {
            display: inline-block;
            padding: 12px 20px;
            border: 1px solid #b74775;
            border-radius: 8px;
            background: #b74775;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font: inherit;
        }

        .success-actions .secondary {
            background: white;
            color: #b74775;
        }

        .order-error {
            padding: 24px;
            text-align: center;
            background: #fff5f5;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .success-page {
                margin: 20px auto;
                padding: 14px;
            }

            .success-card {
                padding: 20px;
            }

            .success-actions > * {
                width: 100%;
                text-align: center;
                box-sizing: border-box;
            }
        }
    </style>
</head>

<body>
    <div data-include="header"></div>
    <main class="success-page">
        <section class="success-card" id="success-content">
            <div class="success-icon">✓</div>

            <h1 class="success-heading">Đặt hàng thành công!</h1>

            <p class="success-description">
                Cảm ơn bạn đã mua sắm tại CHERI.
                Đơn hàng của bạn đã được ghi nhận.
            </p>

            <div class="order-code">
                Mã đơn hàng của bạn
                <strong id="order-code">Đang tải...</strong>
            </div>

            <div class="order-info">
                <h2>Thông tin nhận hàng</h2>
                <p>Người nhận: <strong id="receiver-name">—</strong></p>
                <p>Số điện thoại: <strong id="receiver-phone">—</strong></p>
                <p>Địa chỉ: <span id="receiver-address">—</span></p>
                <p>Thanh toán: <span id="payment-method">—</span></p>
                <p>Trạng thái: <span id="order-status">—</span></p>
            </div>

            <div class="order-info">
                <h2>Sản phẩm đã đặt</h2>
                <div id="order-items"></div>
                <div class="order-total">
                    Tổng thanh toán:
                    <span id="order-total">0đ</span>
                </div>
            </div>

            <div class="success-actions">
                <a href="index.html">Tiếp tục mua sắm</a>
                <button type="button" class="secondary" id="copy-order-code">
                    Sao chép mã đơn hàng
                </button>
            </div>
        </section>
    </main>
    <div data-include="footer"></div>

    <script>
    "use strict";

    const formatMoney = value =>
        new Intl.NumberFormat("vi-VN").format(Number(value) || 0) + "đ";

    const escapeHTML = value =>
        String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[char]);

    const params = new URLSearchParams(window.location.search);
    const urlOrderCode = params.get("code") || "";
    const urlOrderId = params.get("id") || "";

    const isValidOrderCode = value =>
        /^CH[A-Z0-9]+$/i.test(String(value || ""));

    const isValidOrderId = value =>
        /^[1-9]\d*$/.test(String(value || ""));

    const orderCodeElement = document.getElementById("order-code");
    const descriptionElement =
        document.querySelector(".success-description");
    const headingElement =
        document.querySelector(".success-heading");
    const infoSections =
        document.querySelectorAll(".order-info");
    const copyButton =
        document.getElementById("copy-order-code");

    function hideOrderDetails() {
        infoSections.forEach(section => {
            section.hidden = true;
        });
    }

    function normalizeApiOrder(raw) {
        if (!raw || typeof raw !== "object") return null;

        return {
            orderId: raw.id,
            orderCode: raw.order_code,
            idempotencyKey: raw.idempotency_key,
            recipientName: raw.recipient_name,
            phone: raw.phone,
            address: raw.shipping_address,
            paymentMethod: raw.payment_method,
            orderStatus: raw.order_status,
            total: raw.total_amount,
            items: Array.isArray(raw.items)
                ? raw.items.map(item => ({
                    name: item.product_name,
                    size: item.size,
                    colorName: item.color_name,
                    quantity: item.quantity,
                    price: item.unit_price,
                    lineTotal: item.line_total
                }))
                : []
        };
    }

    async function fetchOrderDetails(orderId, token) {
        const headers = {};

        if (token) {
            headers.Authorization = `Bearer ${token}`;
        }

        const endpoints = [];

        if (token) {
            endpoints.push(
                `/api/orders/my-orders/${encodeURIComponent(orderId)}`
            );
        }

        // Cookie HttpOnly được trình duyệt tự gửi cùng request same-origin.
        endpoints.push(
            `/api/orders/guest/${encodeURIComponent(orderId)}`
        );

        for (const endpoint of endpoints) {
            try {
                const response = await fetch(endpoint, {
                    method: "GET",
                    headers,
                    credentials: "same-origin",
                    cache: "no-store"
                });

                if (!response.ok) continue;

                const result = await response.json();

                if (!result.success || !result.order) continue;

                const normalized = normalizeApiOrder(result.order);

                if (
                    normalized &&
                    String(normalized.orderId) === String(orderId) &&
                    isValidOrderCode(normalized.orderCode) &&
                    normalized.orderCode.toUpperCase() ===
                        urlOrderCode.toUpperCase()
                ) {
                    return normalized;
                }
            } catch (error) {
                console.error(
                    "Không thể tải chi tiết đơn hàng:",
                    error
                );
            }
        }

        return null;
    }

    function renderOrder(order) {
        const paymentNames = {
            cod: "Thanh toán khi nhận hàng",
            bank_transfer: "Chuyển khoản ngân hàng",
            online: "Thanh toán trực tuyến"
        };

        const statusNames = {
            pending: "Chờ xác nhận",
            confirmed: "Đã xác nhận",
            processing: "Đang xử lý",
            shipping: "Đang giao hàng",
            completed: "Hoàn thành",
            cancelled: "Đã hủy"
        };

        orderCodeElement.textContent = order.orderCode;

        document.getElementById("receiver-name").textContent =
            order.recipientName || "—";

        document.getElementById("receiver-phone").textContent =
            order.phone || "—";

        document.getElementById("receiver-address").textContent =
            order.address ||
            [
                order.ward,
                order.province
            ].filter(Boolean).join(", ") ||
            "—";

        document.getElementById("payment-method").textContent =
            paymentNames[order.paymentMethod] ||
            order.paymentMethod ||
            "—";

        document.getElementById("order-status").textContent =
            statusNames[order.orderStatus] || "Chờ xác nhận";

        const items = Array.isArray(order.items) ? order.items : [];

        document.getElementById("order-items").innerHTML =
            items.length
                ? items.map(item => {
                    const quantity = Math.max(
                        0,
                        Number(item.quantity ?? item.qty) || 0
                    );

                    const unitPrice = Number(
                        item.price ?? item.unitPrice
                    ) || 0;

                    const lineTotal = item.lineTotal !== undefined
                        ? Number(item.lineTotal) || 0
                        : unitPrice * quantity;

                    return `
                        <div style="padding:12px 0;border-bottom:1px solid #eee">
                            <strong>${escapeHTML(item.name || item.productName || "Sản phẩm")}</strong>
                            <div>
                                Phân loại:
                                ${escapeHTML(item.size || "—")} /
                                ${escapeHTML(item.colorName || item.color || "—")}
                            </div>
                            <div>Số lượng: ${quantity}</div>
                            <div>${formatMoney(lineTotal)}</div>
                        </div>
                    `;
                }).join("")
                : "<p>Không có thông tin sản phẩm để hiển thị.</p>";

        document.getElementById("order-total").textContent =
            formatMoney(order.total);

        infoSections.forEach(section => {
            section.hidden = false;
        });
    }

    function showGenericConfirmation(message) {
        headingElement.textContent = "Chưa thể xác minh đơn hàng";
        descriptionElement.textContent = message;
        orderCodeElement.textContent = "Chưa xác minh";

        hideOrderDetails();

        if (copyButton) {
            copyButton.hidden = true;
        }

        const successIcon = document.querySelector(".success-icon");

        if (successIcon) {
            successIcon.textContent = "!";
            successIcon.setAttribute(
                "aria-label",
                "Chưa xác minh được đơn hàng"
            );
        }
    }

    async function initializeOrderConfirmation() {
        let token = null;
        let pendingStorageKey = "cheri_pending_order_idempotency_guest";
        let order = null;

        if (!isValidOrderCode(urlOrderCode)) {
            headingElement.textContent = "Chưa có thông tin xác nhận";
            descriptionElement.textContent =
                "Không tìm thấy mã đơn hàng hợp lệ. " +
                "Vui lòng kiểm tra lịch sử đơn hàng trước khi thử đặt lại.";

            orderCodeElement.textContent = "Không có mã đơn hàng";
            hideOrderDetails();

            if (copyButton) copyButton.hidden = true;
            return;
        }

        // 1. Đọc thông tin xác thực và xác định vùng pending của tài khoản.
        try {
            token = localStorage.getItem("cheri_auth_token");

            if (token) {
                const user = JSON.parse(
                    localStorage.getItem("cheri_auth_user") || "null"
                );

                const pendingUserId = String(user?.id ?? "").trim();

                pendingStorageKey = /^[1-9]\d*$/.test(pendingUserId)
                    ? `cheri_pending_order_idempotency_user_${pendingUserId}`
                    : null;
            }
        } catch (storageError) {
            console.error(
                "Không thể đọc thông tin xác thực:",
                storageError
            );

            token = null;
            pendingStorageKey = "cheri_pending_order_idempotency_guest";
        }

        // 2. Backend là nguồn xác minh chính thức.
        // Không dùng dữ liệu localStorage để thay thế kết quả API.
        if (isValidOrderId(urlOrderId)) {
            order = await fetchOrderDetails(urlOrderId, token);
        }

        // 3. Chỉ dọn pending sau khi API xác minh được đơn hàng.
        if (order) {
            try {
                const pending = pendingStorageKey
                    ? JSON.parse(
                        localStorage.getItem(pendingStorageKey) || "null"
                    )
                    : null;

                const validPendingKey =
                    /^[A-Za-z0-9_-]{32,100}$/.test(pending?.key || "");

                const matchesOrderId =
                    isValidOrderId(pending?.orderId) &&
                    String(pending.orderId) === String(order.orderId);

                const matchesConfirmationKey =
                    typeof order.idempotencyKey === "string" &&
                    pending?.key === order.idempotencyKey;

                if (
                    pendingStorageKey &&
                    validPendingKey &&
                    (matchesOrderId || matchesConfirmationKey)
                ) {
                    localStorage.removeItem(pendingStorageKey);
                }
            } catch (storageError) {
                console.error(
                    "Không thể dọn khóa idempotency sau xác nhận:",
                    storageError
                );
            }

            renderOrder(order);

            if (copyButton) {
                copyButton.hidden = false;

                copyButton.addEventListener("click", async () => {
                    try {
                        await navigator.clipboard.writeText(
                            order.orderCode
                        );

                        alert(
                            "Đã sao chép mã đơn hàng: " +
                            order.orderCode
                        );
                    } catch (error) {
                        prompt(
                            "Hãy sao chép mã đơn hàng:",
                            order.orderCode
                        );
                    }
                });
            }

            return;
        }

        // 4. API chưa xác minh được: không hiển thị đơn từ localStorage.
        // Giữ pending để người dùng có thể tải lại và đối chiếu sau.
        showGenericConfirmation(
            "Hệ thống chưa xác minh được đơn hàng từ máy chủ. " +
            "Vui lòng kiểm tra lịch sử đơn hàng hoặc tải lại trang. " +
            "Nếu vừa gửi yêu cầu đặt hàng, không gửi lại trước khi kiểm tra trạng thái đơn."
        );
    }

    initializeOrderConfirmation();
</script>
</body>
</html>
