
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | CHERI.</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <script src="../assets/js/app.js" defer></script>
    <script src="../assets/js/auth.js" defer></script>
    <style>
        .auth-page {
            max-width: 460px;
            margin: 48px auto;
            padding: 28px 22px;
        }
        .auth-card {
            padding: 30px;
            border: 1px solid #f0dce5;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 10px 35px #71364b0d;
        }
        .auth-brand {
            text-align: center;
            color: #b74775;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 3px;
        }
        .auth-card h1 { text-align: center; font-size: 25px; }
        .auth-subtitle { text-align: center; color: #777; }
        .auth-field { margin: 18px 0; }
        .auth-field label { display: block; margin-bottom: 7px; font-weight: 600; }
        .auth-field input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font: inherit;
        }
        .auth-field input:focus {
            outline: 2px solid #f3c5d8;
            border-color: #b74775;
        }
        .auth-submit {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #b74775;
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        .auth-submit:disabled { opacity: .65; cursor: wait; }
        .auth-message {
            margin: 16px 0;
            padding: 12px;
            border-radius: 8px;
            background: #fff0f0;
            color: #a12626;
        }
        .auth-message[data-type="success"] {
            background: #eef9f0;
            color: #216c35;
        }
        .auth-links { text-align: center; margin-top: 20px; }
        .auth-links a { color: #b74775; }
        @media (max-width: 520px) {
            .auth-page { margin: 20px auto; padding: 14px; }
            .auth-card { padding: 22px 18px; }
        }
    </style>
</head>
<body>
    <div data-include="header"></div>
    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-brand">CHERI.</div>
            <h1>Chào mừng bạn trở lại</h1>
            <p class="auth-subtitle">Đăng nhập để quản lý đơn hàng của bạn.</p>

            <div id="auth-message" class="auth-message"
                 role="status" aria-live="polite" hidden></div>

            <form id="login-form">
                <div class="auth-field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email"
                           autocomplete="email" required maxlength="190">
                </div>

                <div class="auth-field">
                    <label for="password">Mật khẩu</label>
                    <input id="password" name="password" type="password"
                           autocomplete="current-password" required>
                </div>

                <button class="auth-submit" type="submit">Đăng nhập</button>
            </form>

            <div class="auth-links">
                Chưa có tài khoản?
                <a href="register.html">Đăng ký ngay</a>
                <p><a href="index.html">Quay lại cửa hàng</a></p>
            </div>
        </section>
    </main>
    <div data-include="footer"></div>
</body>
</html>
